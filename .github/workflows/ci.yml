name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development, main]

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck scripts
        run: |
          for script in scripts/*.sh; do
            echo "Checking $script..."
            sh -n "$script"
          done
          echo "All scripts pass syntax check"
      - name: Go vet
        run: |
          go vet ./... 2>&1 | grep -v "^go: downloading" || true
      - name: Markdown linting
        run: |
          pip install markdownlint-cli2
          markdownlint-cli2 '**/*.md' --config .markdownlint.yaml
      - name: YAML linting
        run: |
          pip install yamllint
          yamllint -c .yamllint.yaml .
      - name: Spell checking
        run: |
          pip install codespell
          codespell --skip="*.svg,*.png,*.jpg,*.jpeg,*.gif,*.ico,*.woff,*.woff2,*.ttf,*.eot,*.pdf,*.zip,*.tar.gz,*.tar.bz2,*.tar.xz" '**/*.md'